services:
  postgres:
    image: postgres:16
    container_name: sabikudi-postgres
    environment:
      POSTGRES_DB: sabikudi
      POSTGRES_USER: sabikudi
      POSTGRES_PASSWORD: sabikudi_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabikudi -d sabikudi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
